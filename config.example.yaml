# config.example.yaml — message-service configuration template.
#
# All values are ${VAR} references resolved from the environment at load time
# (see pkg/config/config.go -> configx.WithExpandEnv). For Docker, the
# Dockerfile COPYs this file into the image as config.yaml and entrypoint.sh
# runs migrate + server; values come from .env (see .env.example) or the
# MESSAGE_SERVICE_* defaults baked into docker-compose.yaml. For local dev,
# copy to config.yaml and edit directly.

server:
  grpc_addr: ${MESSAGE_SERVICE_SERVER_GRPC_ADDR}
  max_recv_msg_size_bytes: ${MESSAGE_SERVICE_SERVER_MAX_RECV_MSG_SIZE_BYTES}  # 10 MB default; raised from gRPC's 4MB for inline attachment.content

database:
  driver: ${MESSAGE_SERVICE_DATABASE_DRIVER}              # postgres | mysql | sqlite(空默认 postgres)
  # docker-compose 只跑 postgres;切 mysql/sqlite 时本地编辑 config.yaml 对应块。
  # 这里的 ${...} 由 configx 在加载时展开,docker 经 docker-compose.yaml 注入。
  postgres:
    host: ${MESSAGE_SERVICE_DATABASE_HOST}
    port: ${MESSAGE_SERVICE_DATABASE_PORT}
    user: ${MESSAGE_SERVICE_DATABASE_USER}
    password: ${MESSAGE_SERVICE_DATABASE_PASSWORD}
    dbname: ${MESSAGE_SERVICE_DATABASE_DBNAME}
    sslmode: ${MESSAGE_SERVICE_DATABASE_SSLMODE}
    # schema: ${MESSAGE_SERVICE_DATABASE_POSTGRES_SCHEMA}  # 可选 search_path

redis:
  addr: ${MESSAGE_SERVICE_REDIS_ADDR}
  password: ${MESSAGE_SERVICE_REDIS_PASSWORD}
  db: ${MESSAGE_SERVICE_REDIS_DB}

log:
  level: ${MESSAGE_SERVICE_LOG_LEVEL}
  format: ${MESSAGE_SERVICE_LOG_FORMAT}

email:
  persistence: ${MESSAGE_SERVICE_EMAIL_PERSISTENCE}
  idempotency_ttl: ${MESSAGE_SERVICE_EMAIL_IDEMPOTENCY_TTL}

  # Vendor accounts are NO LONGER configured here — they live in the DB
  # (message_channel_accounts) and are managed via MessageAdminService /
  # the testkit web admin pages. To import existing YAML accounts once:
  #   ./message-service migrate --seed-from-config
  # (put the legacy email.accounts / sms.vendors blocks back temporarily,
  # run the seed, then remove them again).

  attachment:
    # url attachments are pure references (never fetched), so only the
    # inline-content caps remain.
    max_inline_bytes: ${MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_INLINE_BYTES}          # 2 MB
    max_total_inline_bytes: ${MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_TOTAL_INLINE_BYTES} # 5 MB

sms:
  persistence: ${MESSAGE_SERVICE_SMS_PERSISTENCE}
  idempotency_ttl: ${MESSAGE_SERVICE_SMS_IDEMPOTENCY_TTL}
  # Vendor accounts + routes: same as email — DB + admin surface only
  # (see the note above).

idempotency_key_prefix: ${MESSAGE_SERVICE_IDEMPOTENCY_KEY_PREFIX}
# Per-channel TTLs live under email.idempotency_ttl / sms.idempotency_ttl above.

cron:
  timezone: ${MESSAGE_SERVICE_CRON_TIMEZONE}
  overlap_policy: ${MESSAGE_SERVICE_CRON_OVERLAP_POLICY}

third_party:
  gid:
    mode: ${MESSAGE_SERVICE_THIRD_PARTY_GID_MODE}
    config:
      snowflake:
        machine_id: ${MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_MACHINE_ID}
        start_time: ${MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_START_TIME}
