# Generated by service-docker-scaffold. Edit the skill inputs and rerender
# instead of hand-merging dependency files.

services:
  message-service:
    image: ${IMAGE_REPOSITORY:-message-service}:${IMAGE_TAG:-latest}
    build:
      context: "."
      dockerfile: "Dockerfile"
      # Override GOPROXY in .env (e.g. GOPROXY=https://goproxy.cn,direct) when
      # proxy.golang.org is unreachable from the build host.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      - MESSAGE_SERVICE_SERVER_GRPC_ADDR=${MESSAGE_SERVICE_SERVER_GRPC_ADDR:-:19092}
      - MESSAGE_SERVICE_LOG_LEVEL=${MESSAGE_SERVICE_LOG_LEVEL:-info}
      - MESSAGE_SERVICE_DATABASE_DRIVER=${MESSAGE_SERVICE_DATABASE_DRIVER:-postgres}
      - MESSAGE_SERVICE_DATABASE_HOST=${MESSAGE_SERVICE_DATABASE_HOST:-postgres}
      - MESSAGE_SERVICE_DATABASE_PORT=${MESSAGE_SERVICE_DATABASE_PORT:-5432}
      - MESSAGE_SERVICE_DATABASE_USER=${MESSAGE_SERVICE_DATABASE_USER:-postgres}
      - MESSAGE_SERVICE_DATABASE_PASSWORD=${MESSAGE_SERVICE_DATABASE_PASSWORD:-postgres}
      - MESSAGE_SERVICE_DATABASE_DBNAME=${MESSAGE_SERVICE_DATABASE_DBNAME:-message_service}
      - MESSAGE_SERVICE_DATABASE_SSLMODE=${MESSAGE_SERVICE_DATABASE_SSLMODE:-disable}
      - MESSAGE_SERVICE_REDIS_ADDR=${MESSAGE_SERVICE_REDIS_ADDR:-redis:6379}
      - MESSAGE_SERVICE_REDIS_USERNAME=${MESSAGE_SERVICE_REDIS_USERNAME:-}
      - MESSAGE_SERVICE_REDIS_PASSWORD=${MESSAGE_SERVICE_REDIS_PASSWORD:-}
      - MESSAGE_SERVICE_REDIS_DB=${MESSAGE_SERVICE_REDIS_DB:-0}
      - MESSAGE_SERVICE_CRON_OVERLAP_POLICY=${MESSAGE_SERVICE_CRON_OVERLAP_POLICY:-skip}
      - MESSAGE_SERVICE_CRON_TIMEZONE=${MESSAGE_SERVICE_CRON_TIMEZONE:-Asia/Shanghai}
      - MESSAGE_SERVICE_EMAIL_ATTACHMENT_FETCH_TIMEOUT=${MESSAGE_SERVICE_EMAIL_ATTACHMENT_FETCH_TIMEOUT:-30s}
      - MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_BYTES=${MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_BYTES:-10485760}
      - MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_INLINE_BYTES=${MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_INLINE_BYTES:-2097152}
      - MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_TOTAL_INLINE_BYTES=${MESSAGE_SERVICE_EMAIL_ATTACHMENT_MAX_TOTAL_INLINE_BYTES:-5242880}
      - MESSAGE_SERVICE_EMAIL_IDEMPOTENCY_TTL=${MESSAGE_SERVICE_EMAIL_IDEMPOTENCY_TTL:-5m}
      - MESSAGE_SERVICE_EMAIL_PERSISTENCE=${MESSAGE_SERVICE_EMAIL_PERSISTENCE:-true}
      - MESSAGE_SERVICE_EMAIL_PRIMARY_FROM=${MESSAGE_SERVICE_EMAIL_PRIMARY_FROM:-noreply@example.com}
      - MESSAGE_SERVICE_EMAIL_PRIMARY_HOST=${MESSAGE_SERVICE_EMAIL_PRIMARY_HOST:-smtp.example.com}
      - MESSAGE_SERVICE_EMAIL_PRIMARY_NAME=${MESSAGE_SERVICE_EMAIL_PRIMARY_NAME:-default}
      - MESSAGE_SERVICE_EMAIL_PRIMARY_PASSWORD=${MESSAGE_SERVICE_EMAIL_PRIMARY_PASSWORD:-replace-me}
      - MESSAGE_SERVICE_EMAIL_PRIMARY_PORT=${MESSAGE_SERVICE_EMAIL_PRIMARY_PORT:-587}
      - MESSAGE_SERVICE_EMAIL_PRIMARY_USERNAME=${MESSAGE_SERVICE_EMAIL_PRIMARY_USERNAME:-replace-me}
      - MESSAGE_SERVICE_EMAIL_PRIMARY_VENDOR=${MESSAGE_SERVICE_EMAIL_PRIMARY_VENDOR:-aliyun}
      - MESSAGE_SERVICE_IDEMPOTENCY_KEY_PREFIX=${MESSAGE_SERVICE_IDEMPOTENCY_KEY_PREFIX:-msg:idem}
      - MESSAGE_SERVICE_LOG_FORMAT=${MESSAGE_SERVICE_LOG_FORMAT:-json}
      - MESSAGE_SERVICE_SERVER_MAX_RECV_MSG_SIZE_BYTES=${MESSAGE_SERVICE_SERVER_MAX_RECV_MSG_SIZE_BYTES:-10485760}
      - MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_ACCESS_KEY_ID=${MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_ACCESS_KEY_ID:-replace-me}
      - MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_ACCESS_KEY_SECRET=${MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_ACCESS_KEY_SECRET:-replace-me}
      - MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_NAME=${MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_NAME:-default}
      - MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_REGION_ID=${MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_REGION_ID:-cn-hangzhou}
      - MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_SIGN_NAME=${MESSAGE_SERVICE_SMS_ALIYUN_PRIMARY_SIGN_NAME:-replace-me}
      - MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_ACCESS_KID=${MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_ACCESS_KID:-}
      - MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_NAME=${MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_NAME:-}
      - MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_SECRET_KEY=${MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_SECRET_KEY:-}
      - MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_SIGN=${MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_SIGN:-}
      - MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_SMS_ACCOUNT=${MESSAGE_SERVICE_SMS_BYTEPLUS_PRIMARY_SMS_ACCOUNT:-}
      - MESSAGE_SERVICE_SMS_DEFAULT_COUNTRY=${MESSAGE_SERVICE_SMS_DEFAULT_COUNTRY:-CN}
      - MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_APP_KEY=${MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_APP_KEY:-}
      - MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_APP_SECRET=${MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_APP_SECRET:-}
      - MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_ENDPOINT=${MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_ENDPOINT:-}
      - MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_NAME=${MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_NAME:-}
      - MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_REGION=${MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_REGION:-}
      - MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_SIGN=${MESSAGE_SERVICE_SMS_HUAWEI_PRIMARY_SIGN:-}
      - MESSAGE_SERVICE_SMS_IDEMPOTENCY_TTL=${MESSAGE_SERVICE_SMS_IDEMPOTENCY_TTL:-5m}
      - MESSAGE_SERVICE_SMS_PERSISTENCE=${MESSAGE_SERVICE_SMS_PERSISTENCE:-true}
      - MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_NAME=${MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_NAME:-}
      - MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_REGION=${MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_REGION:-}
      - MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SECRET_ID=${MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SECRET_ID:-}
      - MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SECRET_KEY=${MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SECRET_KEY:-}
      - MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SIGN_NAME=${MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SIGN_NAME:-}
      - MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SMS_SDK_APP_ID=${MESSAGE_SERVICE_SMS_TENCENT_PRIMARY_SMS_SDK_APP_ID:-}
      - MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_ACCESS_KID=${MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_ACCESS_KID:-}
      - MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_NAME=${MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_NAME:-}
      - MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_SECRET_KEY=${MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_SECRET_KEY:-}
      - MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_SIGN=${MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_SIGN:-}
      - MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_SMS_ACCOUNT=${MESSAGE_SERVICE_SMS_VOLCENGINE_PRIMARY_SMS_ACCOUNT:-}
      - MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_MACHINE_ID=${MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_MACHINE_ID:-1}
      - MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_START_TIME=${MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_START_TIME:-2026-06-01T00:00:00Z}
      - MESSAGE_SERVICE_THIRD_PARTY_GID_MODE=${MESSAGE_SERVICE_THIRD_PARTY_GID_MODE:-module}
      - VAR=${VAR:-}
    ports:
      - "${HOST_GRPC_PORT:-19092}:19092"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:19092", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      - POSTGRES_DB=${MESSAGE_SERVICE_DATABASE_DBNAME:-message_service}
      - POSTGRES_USER=${MESSAGE_SERVICE_DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${MESSAGE_SERVICE_DATABASE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MESSAGE_SERVICE_DATABASE_USER:-postgres}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}


  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-20}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-3s}

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-message-service-pgdata}
  redisdata:
    name: ${REDIS_VOLUME:-message-service-redisdata}
