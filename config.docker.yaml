idempotency_key_prefix: ${MESSAGE_SERVICE_IDEMPOTENCY_KEY_PREFIX}
# Per-channel TTLs live under email.idempotency_ttl / sms.idempotency_ttl above.

cron:
  timezone: ${MESSAGE_SERVICE_CRON_TIMEZONE}
  overlap_policy: ${MESSAGE_SERVICE_CRON_OVERLAP_POLICY}

third_party:
  gid:
    mode: ${MESSAGE_SERVICE_THIRD_PARTY_GID_MODE}
    config:
      snowflake:
        machine_id: ${MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_MACHINE_ID}
        start_time: ${MESSAGE_SERVICE_THIRD_PARTY_GID_CONFIG_SNOWFLAKE_START_TIME}
