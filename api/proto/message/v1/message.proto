syntax = "proto3";

package message.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// MessageStatus represents the delivery status of a message.
enum MessageStatus {
  // UNSPECIFIED — never persisted.
  MESSAGE_STATUS_UNSPECIFIED = 0;

  // PENDING — send in progress. Reserved for future async-send flow;
  // the sync flow does NOT write PENDING (currently unused).
  MESSAGE_STATUS_PENDING = 1;

  // SENT — the vendor synchronously accepted the send request.
  // For SMS: vendor API returned OK; does NOT mean handset received
  //          (async delivery is not tracked yet).
  // For email: SMTP server accepted the message.
  MESSAGE_STATUS_SENT = 2;

  // FAILED — the vendor rejected the request, network/transport failed,
  // or context was cancelled. error_message carries the last error.
  MESSAGE_STATUS_FAILED = 3;
}

// EmailVendor represents the email service brand. Each vendor offers SMTP
// access today; an API path may be added per-vendor in the future. Vendor
// is an audit label and (vendor, account) selection key — the underlying
// transport is always SMTP. Vendors are configured in config.yaml; selecting
// one with an unconfigured account returns ErrBadRequest.
enum EmailVendor {
  EMAIL_VENDOR_UNSPECIFIED = 0;
  EMAIL_VENDOR_ALIYUN = 1;      // Aliyun DirectMail.
  EMAIL_VENDOR_TENCENT = 2;     // Tencent SES.
  EMAIL_VENDOR_NETEASE = 3;     // NetEase EasyMail.
}

// SmsVendor represents the SMS service brand. Path capabilities differ:
//   - Domestic (CN) vendors: template-based only; raw content rejected.
//   - International vendors split into:
//       * raw-content (ALIYUN, VOLCENGINE intl, ...): caller supplies Content.
//       * template-based (TENCENT intl, BYTEPLUS): caller supplies TemplateID + Params.
// The service picks a path automatically from the destination region_code,
// unless the request explicitly sets vendor + account.
enum SmsVendor {
  SMS_VENDOR_UNSPECIFIED = 0;
  SMS_VENDOR_ALIYUN = 1;      // Aliyun (domestic + intl SendMessageToGlobe).
  SMS_VENDOR_TENCENT = 2;     // Tencent Cloud SMS (domestic + intl via SdkAppid).
  SMS_VENDOR_VOLCENGINE = 3;  // ByteDance Volcengine SMS.
  SMS_VENDOR_BYTEPLUS = 4;    // Byteplus (intl-only, template-based).
  SMS_VENDOR_HUAWEI = 5;      // Huawei Cloud SMS.
}

// EmailScene represents the business purpose of an email. Required on every
// send. Used for audit, filtering, and stats grouping — NOT for routing
// (vendor selection is independent of scene).
enum EmailScene {
  EMAIL_SCENE_UNSPECIFIED = 0;
  EMAIL_SCENE_LOGIN_CODE = 1;        // One-time login verification code.
  EMAIL_SCENE_FORGOT_PASSWORD = 2;   // Password reset link / code.
  EMAIL_SCENE_REGISTER = 3;          // Registration verification code.
  EMAIL_SCENE_CHANGE_PASSWORD = 4;   // Confirmation of password change.
  EMAIL_SCENE_BIND_ACCOUNT = 5;      // Bind a new email/identity to an account.
  EMAIL_SCENE_NOTIFICATION = 6;      // Generic transactional notification.
  EMAIL_SCENE_VERIFY_EMAIL = 7;      // Verify ownership of an email address.
}

// SmsScene represents the business purpose of an SMS. Required on every send.
// Mirrors EmailScene; VERIFY_PHONE is the SMS counterpart of VERIFY_EMAIL
// (cross-channel pairs like VERIFY_EMAIL+SMS are rejected by SendSMS).
enum SmsScene {
  SMS_SCENE_UNSPECIFIED = 0;
  SMS_SCENE_LOGIN_CODE = 1;        // One-time login verification code.
  SMS_SCENE_FORGOT_PASSWORD = 2;   // Password reset code.
  SMS_SCENE_REGISTER = 3;          // Registration verification code.
  SMS_SCENE_CHANGE_PASSWORD = 4;   // Confirmation of password change.
  SMS_SCENE_BIND_ACCOUNT = 5;      // Bind a new phone to an account.
  SMS_SCENE_VERIFY_PHONE = 6;      // Verify ownership of a phone number.
}

// SortField selects the column used to order List responses.
// Only CREATED_AT is currently defined; future versions may add more.
enum SortField {
  SORT_FIELD_UNSPECIFIED = 0;
  SORT_FIELD_CREATED_AT = 1;
}

// SortDirection selects ascending or descending order. UNSPECIFIED must be
// treated as DESC by the service layer (preserves current behavior).
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

// Email attachments are always delivered as real MIME parts — the recipient's
// mail client renders its own attachment list / preview, so message-service
// never injects links into htmlBody. Byte source is one of:
//   - url:     service fetches bytes at send time (large objects, OSS pre-signed)
//   - content: caller supplies raw bytes inline (small attachments, no OSS needed)
// See EmailAttachment for the url XOR content contract.

// MessageService handles sending, recording, and querying messages.
//
// Channel split: emails and SMSs have parallel RPC families — Send, Get,
// List (offset), ListByCursor, and Stats — plus three cross-channel helpers
// (ListSMSRegions / ListSMSSenders / ListEmailSenders) for UI filter dropdowns.
//
// Persistence: when persistence.{email,sms}.enabled = false, query RPCs return
// ErrPersistenceDisabled (503) — send RPCs still work (records skipped).
//
// Idempotency: orthogonal to persistence. When idempotency_key is set, Redis
// dedupes per (sender_id, key); see SendEmail/SendSMS for the exact contract.
// Pong is the health-check response — only public, non-sensitive info
// (service name, version, git/build info, timestamps). Never include internal
// addresses, IPs, env vars, secrets, or dependency topology here.
message Pong {
  string service = 1;       // service name, e.g. "message-service"
  string version = 2;       // semantic version (ldflags; "dev" by default)
  string git_commit = 3;    // short commit hash (ldflags or VCS-embedded)
  string git_branch = 4;    // git branch (ldflags)
  string build_time = 5;    // build time, RFC3339 UTC (ldflags)
  string go_version = 6;    // Go toolchain version (runtime, not injected)
  string status = 7;        // "SERVING" when serving normally
  int64 now = 8;            // server time, Unix millis
  int64 started_at = 9;     // process start time, Unix millis (uptime)
}

service MessageService {
  rpc Ping(google.protobuf.Empty) returns (Pong) {
    option (google.api.http) = { get: "/ping" };
  }

  // SendEmail sends an email via the configured vendor/account, or the default
  // fallback chain when both vendor + account are unset.
  //
  // Idempotency (when idempotency_key is set): Redis dedupes per
  // (sender_id, idempotency_key).
  //   - First request: sends + caches the success response.
  //   - Concurrent second request: returns ErrIdempotencyConflict (409) while
  //     the first is in flight.
  //   - Sequential replay after success: returns the cached response without
  //     re-sending.
  //   - Failure: reservation released — caller can retry the same key.
  //
  // Required fields: to, subject, body (or html_body), scene, sender_id.
  // vendor + account must be set together or both empty.
  // Returns: record ID + MessageStatus (SENT on success).
  // Errors: ErrBadRequest on validation; ErrMessageSendFailed on vendor
  // rejection / transport failure (NOT cached — safe to retry the same key).
  rpc SendEmail(SendEmailRequest) returns (SendResponse) {
    option (google.api.http) = {
      post: "/v1/messages:email"
      body: "*"
    };
  }

  // SendSMS sends an SMS via the configured vendor/account, or routes by phone
  // country code when both are unset.
  //
  // Path selection by region_code:
  //   - "CN" (domestic): template-based only. template_id + sign_name +
  //     template_params required; content is ignored.
  //   - other (international): caller picks ONE of template_id (template-based
  //     vendor: Byteplus, Tencent intl) OR content (raw-content vendor: Aliyun
  //     intl, Twilio-style). Setting both is a validation error.
  //
  // Idempotency: same contract as SendEmail.
  // Required fields: region_code (ISO alpha-2), phone (local, no "+"), scene,
  // sender_id. sign_name required for CN + some intl paths.
  // Returns: record ID + MessageStatus (SENT on success).
  // Errors: ErrBadRequest on validation (incl. invalid phone / region); see
  // SendSMSRequest.phone_no_plus for the "+" rule.
  rpc SendSMS(SendSMSRequest) returns (SendResponse) {
    option (google.api.http) = {
      post: "/v1/messages:sms"
      body: "*"
    };
  }

  // GetEmail returns a single email record by ID.
  // Errors: ErrEmailNotFound (404); ErrPersistenceDisabled (503) when email
  // persistence is off.
  rpc GetEmail(GetEmailRequest) returns (EmailRecord) {
    option (google.api.http) = {get: "/v1/emails/{id}"};
  }

  // ListEmails returns an offset-paginated list of email records matching the
  // filter. Each page runs a COUNT(*) for totals — for large datasets or
  // streaming scans, use ListEmailsByCursor instead.
  // Errors: ErrPersistenceDisabled (503) when email persistence is off.
  rpc ListEmails(ListEmailsRequest) returns (ListEmailsResponse) {
    option (google.api.http) = {get: "/v1/emails"};
  }

  // ListEmailsByCursor returns a cursor-paginated list of email records.
  // Stable under concurrent writes: ordering is (sort_field, id) with id as
  // tiebreaker, so inserts mid-scan do not cause skips or duplicates.
  // Skips COUNT(*) by default; set include_total=true when totals are needed
  // (the first page can usually return total == len(records) without a count).
  // Errors: ErrPersistenceDisabled (503) when email persistence is off;
  // ErrBadRequest on malformed page_token.
  rpc ListEmailsByCursor(ListEmailsByCursorRequest) returns (ListEmailsByCursorResponse) {
    option (google.api.http) = {get: "/v1/emails:cursor"};
  }

  // GetEmailStats returns aggregated statistics for emails matching the filter
  // (vendor, scene, time range). success_rate is in [0, 100]; -1 means "no
  // data" (total == 0). Per-vendor breakdown is included.
  // Errors: ErrPersistenceDisabled (503) when email persistence is off.
  rpc GetEmailStats(GetEmailStatsRequest) returns (EmailStatsResponse) {
    option (google.api.http) = {get: "/v1/emails:stats"};
  }

  // GetSMS returns a single SMS record by ID.
  // Errors: ErrSMSNotFound (404); ErrPersistenceDisabled (503) when SMS
  // persistence is off.
  rpc GetSMS(GetSMSRequest) returns (SMSRecord) {
    option (google.api.http) = {get: "/v1/sms/{id}"};
  }

  // ListSMS returns an offset-paginated list of SMS records matching the
  // filter. See ListEmails for pagination trade-offs.
  // Errors: ErrPersistenceDisabled (503) when SMS persistence is off.
  rpc ListSMS(ListSMSRequest) returns (ListSMSResponse) {
    option (google.api.http) = {get: "/v1/sms"};
  }

  // ListSMSByCursor returns a cursor-paginated list of SMS records.
  // See ListEmailsByCursor for semantics.
  // Errors: ErrPersistenceDisabled (503) when SMS persistence is off;
  // ErrBadRequest on malformed page_token.
  rpc ListSMSByCursor(ListSMSByCursorRequest) returns (ListSMSByCursorResponse) {
    option (google.api.http) = {get: "/v1/sms:cursor"};
  }

  // GetSMSStats returns aggregated statistics for SMS messages matching the
  // filter. See GetEmailStats for response shape.
  // Errors: ErrPersistenceDisabled (503) when SMS persistence is off.
  rpc GetSMSStats(GetSMSStatsRequest) returns (SMSStatsResponse) {
    option (google.api.http) = {get: "/v1/sms:stats"};
  }

  // ListSMSRegions returns distinct region_code values matching existing SMS
  // records, for populating frontend filter dropdowns. Cheap (low-cardinality
  // DISTINCT). Callers further filter client-side if needed.
  // Errors: ErrPersistenceDisabled (503) when SMS persistence is off.
  rpc ListSMSRegions(ListSMSRegionsRequest) returns (ListSMSRegionsResponse) {
    option (google.api.http) = {get: "/v1/sms:regions"};
  }

  // ListSMSSenders returns distinct sender_id values across SMS records, for
  // populating frontend filter dropdowns.
  // Errors: ErrPersistenceDisabled (503) when SMS persistence is off.
  rpc ListSMSSenders(ListSMSSendersRequest) returns (ListSMSSendersResponse) {
    option (google.api.http) = {get: "/v1/sms:senders"};
  }

  // ListEmailSenders returns distinct sender_id values across email records,
  // for populating frontend filter dropdowns.
  // Errors: ErrPersistenceDisabled (503) when email persistence is off.
  rpc ListEmailSenders(ListEmailSendersRequest) returns (ListEmailSendersResponse) {
    option (google.api.http) = {get: "/v1/emails:senders"};
  }
}

// SendEmailRequest is the request to send an email.
message SendEmailRequest {
  repeated EmailAddress to = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated EmailAddress cc = 2;
  repeated EmailAddress bcc = 3;
  string subject = 4 [(buf.validate.field).string.min_len = 1];
  string body = 5;
  string html_body = 6;
  EmailAddress reply_to = 7;
  // Vendor + Account optionally select a specific configured account.
  // Both must be set together; if both zero/empty, sender uses default fallback.
  EmailVendor vendor = 8;
  string account = 9;
  // Template is optional: vendors that do not support templating ignore it.
  string template_id = 10;
  map<string, string> template_params = 11;
  // Scene is the business purpose of this email (required).
  EmailScene scene = 12;
  // SenderID identifies the calling business service (e.g. "user-service",
  // "pay-service"). Required. NOT the end-user/admin id — the caller must
  // record that in its own audit trail.
  string sender_id = 13;

  // IdempotencyKey is optional. When set, a second request with the same
  // (sender_id, idempotency_key) returns the existing record without
  // re-sending. Use a UUID per logical send intent. Max length 64.
  string idempotency_key = 14 [(buf.validate.field).string.max_len = 64];

  // From optionally overrides the account's configured From address.
  // Empty falls back to the account default. The SMTP server is the
  // ultimate arbiter of which From addresses are accepted (verified
  // sender lists, etc.); the service does not pre-constrain.
  EmailAddress from = 15;

  // attachments is optional. LINK attachments augment html_body; MIME
  // attachments are downloaded and added as real MIME parts. Mixed lists
  // are allowed — each attachment carries its own kind.
  repeated EmailAttachment attachments = 16;

  option (buf.validate.message).cel = {
    id: "vendor_account_pair"
    message: "vendor and account must both be set or both be empty"
    expression: "(this.vendor == 0 && this.account == '') || (this.vendor != 0 && this.account != '')"
  };
  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
  option (buf.validate.message).cel = {
    id: "sender_required"
    message: "sender_id is required"
    expression: "this.sender_id != ''"
  };
}

// EmailAddress is one recipient or sender. email is required; display_name
// is optional and rendered as the RFC 5322 mailbox "Name" <email> form when
// set. The service persists only the bare email (for query filtering);
// display_name is not stored.
message EmailAddress {
  string email = 1 [(buf.validate.field).string.email = true];
  string display_name = 2;
}

// EmailAttachment describes one attachment on an email. Source of bytes is
// either url (caller-managed object storage) or content (inline bytes for
// small attachments). The same message type appears on SendEmailRequest
// (input) and EmailRecord (query).
message EmailAttachment {
  reserved 1;
  reserved "kind";

  // filename is the MIME filename. Required.
  string filename = 2 [(buf.validate.field).string.min_len = 1];

  // url is the HTTP or HTTPS URL of the attachment content. Service fetches
  // the bytes at send time. Mutually exclusive with content — exactly one of
  // the two must be set. Service rejects non-http(s) schemes (file://, ftp://,
  // gopher://, etc.) to mitigate SSRF; the HTTP client does not follow
  // redirects.
  string url = 3;

  // content is the raw attachment bytes supplied inline. Mutually exclusive
  // with url — exactly one of the two must be set. Bounded by
  // attachment.max_inline_bytes (single attachment) and
  // attachment.max_total_inline_bytes (sum across the request). Attachments
  // exceeding these limits must use url instead.
  bytes content = 8;

  // inline selects rendering: true = CID-embedded (display inline in the
  // body where the caller referenced the CID); false = regular attachment
  // shown in the client's attachment list. When inline=true with a non-image
  // MIME type, the attachment silently falls back to regular.
  bool inline = 4;

  // mime_type is optional. Empty = let MIME detection infer from filename.
  string mime_type = 5;

  // size_bytes is optional. When non-zero, pre-validated against
  // max_bytes (url path: before fetch; content path: against len(content)).
  // Zero = no pre-check; the hard cap is still enforced after fetch / for
  // content length.
  int64 size_bytes = 6;

  reserved 7;
  reserved "expires_at";
}

// SendSMSRequest is the request to send an SMS.
message SendSMSRequest {
  // region_code is the ISO 3166-1 alpha-2 region code used to parse phone
  // (e.g. "CN", "US", "HK"). Required. Acts as defaultRegion for
  // phonenumber parsing — NOT a dialing code like "86".
  string region_code = 1 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];

  // phone is the local phone number WITHOUT the international prefix
  // (e.g. "13800138000", "5551234567"). Must NOT start with "+".
  string phone = 2 [(buf.validate.field).string.min_len = 1];

  // content is the raw SMS body for vendors that accept raw text (typically
  // the international path). Substitution of placeholders (e.g. "{code}") is
  // the caller's responsibility — message-service forwards the string as-is.
  string content = 3;
  string template_id = 4;
  map<string, string> template_params = 5;

  // Vendor + Account optionally select a specific configured account.
  // Both must be set together; if both zero/empty, sender routes by phone country.
  SmsVendor vendor = 6;
  string account = 7;

  // Scene is the business purpose of this SMS (required).
  SmsScene scene = 8;

  // SenderID identifies the calling business service (e.g. "user-service",
  // "pay-service"). Required. NOT the end-user/admin id — the caller must
  // record that in its own audit trail.
  string sender_id = 9;

  // IdempotencyKey is optional. See SendEmailRequest.idempotency_key.
  string idempotency_key = 10 [(buf.validate.field).string.max_len = 64];

  // SignName carries the per-message signature/sender ID semantics:
  //   - For domestic SMS (region_code == "CN"): the SMS signature that must
  //     match the pre-registered sign in the vendor console (e.g. "阿里云",
  //     "字节跳动"). Domestic vendors reject sends without it.
  //   - For international SMS (other region_code): treated as the sender ID
  //     / "From" field. Some regions require pre-registered alphabetic
  //     sender IDs; vendors apply region-specific rules.
  // Required for paths whose vendor enforces a signature (all current
  // domestic vendors do).
  string sign_name = 11 [(buf.validate.field).string.max_len = 64];

  option (buf.validate.message).cel = {
    id: "vendor_account_pair"
    message: "vendor and account must both be set or both be empty"
    expression: "(this.vendor == 0 && this.account == '') || (this.vendor != 0 && this.account != '')"
  };
  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
  option (buf.validate.message).cel = {
    id: "sender_required"
    message: "sender_id is required"
    expression: "this.sender_id != ''"
  };
  option (buf.validate.message).cel = {
    id: "phone_no_plus"
    message: "phone must not start with '+' — provide local number only"
    expression: "!this.phone.startsWith('+')"
  };
}

// SendResponse is the response from SendEmail and SendSMS.
message SendResponse {
  int64 id = 1;
  MessageStatus status = 2;
  // vendor reports which vendor actually handled the send.
  oneof vendor {
    EmailVendor email_vendor = 3;
    SmsVendor sms_vendor = 4;
  }
}

// GetEmailRequest is the request to fetch a single email record.
message GetEmailRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// GetSMSRequest is the request to fetch a single SMS record.
message GetSMSRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// EmailRecord is the stored record of a sent email.
message EmailRecord {
  int64 id = 1;
  EmailVendor vendor = 2;
  string account = 3;
  EmailScene scene = 4;
  MessageStatus status = 5;
  EmailAddress target = 6;
  // SenderID identifies the calling business service (e.g. "user-service",
  // "pay-service"). NOT the end-user/admin id — the caller must record that
  // in its own audit trail.
  string sender_id = 7;
  repeated EmailAddress cc = 8;
  repeated EmailAddress bcc = 9;
  string subject = 10;
  string content = 11;
  string html_body = 12;
  EmailAddress reply_to = 13;
  string template_id = 14;
  map<string, string> template_params = 15;
  string error_message = 16;
  int32 attempts = 17;
  int64 sent_at = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
  // attachments lists metadata for each attachment recorded at send time.
  // Empty when no attachments were sent or persistence is disabled.
  repeated EmailAttachment attachments = 21;
}

// SMSRecord is the stored record of a sent SMS.
message SMSRecord {
  int64 id = 1;
  SmsVendor vendor = 2;
  string account = 3;
  SmsScene scene = 4;
  MessageStatus status = 5;
  string region_code = 6;
  string phone = 7;
  // SenderID identifies the calling business service. See SendSMSRequest.sender_id.
  string sender_id = 8;
  string content = 9;
  string template_id = 10;
  map<string, string> template_params = 11;
  string error_message = 12;
  int32 attempts = 13;
  int64 sent_at = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
}

// ListEmailsRequest filters and paginates a ListEmails query.
message ListEmailsRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  MessageStatus status = 3;
  string target = 4;
  // SenderID identifies the calling business service (e.g. "user-service",
  // "pay-service"). Optional filter; NOT the end-user/admin id — the caller
  // must record that in its own audit trail.
  string sender_id = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  int32 page = 8;
  int32 page_size = 9;
  SortField sort_field = 10;
  SortDirection sort_direction = 11;
}

// ListEmailsResponse contains a page of email records plus pagination metadata.
message ListEmailsResponse {
  repeated EmailRecord records = 1;
  int32 total = 2;
  int32 total_pages = 3;
  bool has_more = 4;
}

// ListSMSRequest filters and paginates a ListSMS query.
message ListSMSRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  MessageStatus status = 3;
  string region_code = 4;
  string phone = 5;
  // SenderID identifies the calling business service (e.g. "user-service",
  // "pay-service"). Optional filter; NOT the end-user/admin id — the caller
  // must record that in its own audit trail.
  string sender_id = 6;
  int64 start_time = 7;
  int64 end_time = 8;
  int32 page = 9;
  int32 page_size = 10;
  SortField sort_field = 11;
  SortDirection sort_direction = 12;
}

// ListSMSResponse contains a page of SMS records plus pagination metadata.
message ListSMSResponse {
  repeated SMSRecord records = 1;
  int32 total = 2;
  int32 total_pages = 3;
  bool has_more = 4;
}

// ListEmailsByCursorRequest filters and cursor-paginates a ListEmailsByCursor
// query. page_token is opaque — obtain it from the previous response's
// next_page_token; empty means first page.
message ListEmailsByCursorRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  MessageStatus status = 3;
  string target = 4;
  // SenderID identifies the calling business service (e.g. "user-service",
  // "pay-service"). Optional filter; NOT the end-user/admin id — the caller
  // must record that in its own audit trail.
  string sender_id = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  SortField sort_field = 8;
  SortDirection sort_direction = 9;
  int32 page_size = 10;
  string page_token = 11;
  // include_total controls whether COUNT(*) runs. Defaults to false: cursor
  // users usually don't need the total, and COUNT(*) is expensive on large
  // tables.
  bool include_total = 12;
}

message ListEmailsByCursorResponse {
  repeated EmailRecord records = 1;
  // total is 0 when include_total = false. Otherwise reflects the count
  // matching the filter (ignoring cursor position).
  int32 total = 2;
  // next_page_token is empty when there is no next page.
  string next_page_token = 3;
}

// ListSMSByCursorRequest filters and cursor-paginates a ListSMSByCursor query.
message ListSMSByCursorRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  MessageStatus status = 3;
  string region_code = 4;
  string phone = 5;
  // SenderID identifies the calling business service (e.g. "user-service",
  // "pay-service"). Optional filter; NOT the end-user/admin id — the caller
  // must record that in its own audit trail.
  string sender_id = 6;
  int64 start_time = 7;
  int64 end_time = 8;
  SortField sort_field = 9;
  SortDirection sort_direction = 10;
  int32 page_size = 11;
  string page_token = 12;
  bool include_total = 13;
}

message ListSMSByCursorResponse {
  repeated SMSRecord records = 1;
  int32 total = 2;
  string next_page_token = 3;
}

// GetEmailStatsRequest filters a GetEmailStats query.
message GetEmailStatsRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

// GetSMSStatsRequest filters a GetSMSStats query.
message GetSMSStatsRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}

// EmailStatsResponse contains aggregated email statistics.
message EmailStatsResponse {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  // success_rate is in [0, 100]; -1 means "no data" (total == 0).
  double success_rate = 4;
  repeated EmailVendorStats vendors = 5;
}

// SMSStatsResponse contains aggregated SMS statistics.
message SMSStatsResponse {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  // success_rate is in [0, 100]; -1 means "no data" (total == 0).
  double success_rate = 4;
  repeated SmsVendorStats vendors = 5;
}

// EmailVendorStats holds per-vendor statistics for email messages.
message EmailVendorStats {
  EmailVendor vendor = 1;
  int64 total = 2;
  int64 sent = 3;
  int64 failed = 4;
}

// SmsVendorStats holds per-vendor statistics for SMS messages.
message SmsVendorStats {
  SmsVendor vendor = 1;
  int64 total = 2;
  int64 sent = 3;
  int64 failed = 4;
}

// ListSMSRegionsRequest is empty — region sets are low-cardinality and the
// distinct query is cheap, so callers filter client-side if they need to.
message ListSMSRegionsRequest {}

message ListSMSRegionsResponse {
  repeated string region_codes = 1;
}

// ListSMSSendersRequest is empty. See ListSMSRegionsRequest.
message ListSMSSendersRequest {}

message ListSMSSendersResponse {
  repeated string sender_ids = 1;
}

// ListEmailSendersRequest is empty. See ListSMSRegionsRequest.
message ListEmailSendersRequest {}

message ListEmailSendersResponse {
  repeated string sender_ids = 1;
}
