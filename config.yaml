server:
  grpc_addr: ":9000"
  http_addr: ":8080"
  max_recv_msg_size_bytes: 10485760  # 10 MB — gRPC server cap; raised from gRPC's 4MB default to allow inline attachment.content payloads

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: message_service
  sslmode: disable

redis:
  addr: localhost:6379
  password: ""
  db: 0

log:
  level: info
  format: json

email:
  # Persistence controls whether send records are written to the DB.
  # Set false to skip DB writes (sends only).
  persistence: true
  # idempotency_ttl is the Redis idempotency window for the email channel
  # (time.ParseDuration format). Shared key prefix lives at top-level idempotency.key_prefix.
  idempotency_ttl: 5m

  accounts:
    - name: default
      vendor: aliyun               # required, one of aliyun/tencent/netease
      host: smtp.example.com
      port: 587
      username: ""
      password: ""
      from: noreply@example.com

  # Email-specific attachment policy. Defaults come from `default:` tags on
  # AttachmentConfig — every field below can be omitted in production.
  attachment:
    fetch_timeout: 30s              # HTTP timeout for URL-sourced attachment fetch
    max_bytes: 10485760             # 10 MB — hard cap per single attachment (url fetch or inline content)
    max_inline_bytes: 2097152       # 2 MB — single attachment.content payload
    max_total_inline_bytes: 5242880 # 5 MB — sum of all attachment.content in one request

sms:
  default_country: CN
  # Persistence controls whether send records are written to the DB.
  # Set false to skip DB writes (sends only).
  persistence: true
  # idempotency_ttl is the Redis idempotency window for the SMS channel
  # (time.ParseDuration format). Shared key prefix lives at top-level idempotency.key_prefix.
  idempotency_ttl: 5m
  vendors:
    aliyun:
      accounts:
        - name: default
          aliyun:
            access_key_id: ""
            access_key_secret: ""
            sign_name: ""
            region_id: cn-hangzhou

