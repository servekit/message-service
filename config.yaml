idempotency_key_prefix: msg:idem   # Redis key namespace; change when sharing Redis across services.
                                    # Per-channel TTLs live under email.idempotency_ttl / sms.idempotency_ttl.

cron:
  timezone: "Asia/Shanghai"
  overlap_policy: "skip"

third_party:
  gid:
    mode: module
    config:
      snowflake:
        machine_id: 1
        start_time: "2026-06-01T00:00:00Z"
